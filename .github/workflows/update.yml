name: update-data
on:
  schedule: [{cron: "0 */6 * * *"}]   # 6 saatte bir
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Veriyi üret ama repoya yazma"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_price_history_browser.js tests/test_prediction_listing.js
      - run: python scanner.py
      - if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: |
          git config user.name "coin-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json docs/report.json
          git diff --staged --quiet || (git commit -m "veri güncellendi" && git push)
